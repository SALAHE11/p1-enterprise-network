<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="890" viewBox="0 0 1280 890" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>Project 1: lab topology and IP plan v1</title>
  <style>
    .bg{fill:#ffffff}
    .zone{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2;stroke-dasharray:6 4}
    .zdmz{fill:#fff4e8;stroke:#e3b585;stroke-width:1.2;stroke-dasharray:6 4}
    .zsrv{fill:#eef5ff;stroke:#9cc3f0;stroke-width:1.2;stroke-dasharray:6 4}
    .panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .info{fill:#ffffff;stroke:#d0d7de;stroke-width:1.2}
    .ztitle{font-size:13px;font-weight:700;fill:#424a53}
    .ztitle2{font-size:12px;font-weight:700;fill:#424a53}
    .node{fill:#ffffff;stroke:#8c959f;stroke-width:1.3}
    .fw{fill:#fff8f0;stroke:#bc4c00;stroke-width:2}
    .name{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:14px;font-weight:700;fill:#1f2328;text-anchor:middle}
    .sub{font-size:12px;fill:#57606a;text-anchor:middle}
    .link{stroke:#6e7781;stroke-width:1.5;fill:none}
    .tun{stroke:#cf222e;stroke-width:1.8;fill:none;stroke-dasharray:7 5}
    .stp{stroke:#6e7781;stroke-width:1.5;fill:none;stroke-dasharray:2 4}
    .lbl{font-size:12px;fill:#424a53}
    .lblr{font-size:12px;fill:#cf222e}
    .title{font-size:22px;font-weight:700;fill:#1f2328}
    .subtitle{font-size:13px;fill:#57606a}
    .ptitle{font-size:14px;font-weight:700;fill:#1f2328}
    .ptext{font-size:12px;fill:#424a53}
    .pbold{font-size:12px;font-weight:700;fill:#1f2328}
    .pval{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12px;fill:#1f2328;text-anchor:end}
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="890" rx="12"/>

  <text class="title" x="30" y="44">Project 1 · Lab topology and IP plan v1</text>
  <text class="subtitle" x="30" y="66">Fictional company: HQ, one branch, one remote worker · all internal ranges inside 10.18.0.0/15</text>

  <!-- Zones -->
  <rect class="zone" x="30" y="80" width="240" height="116" rx="10"/>
  <text class="ztitle" x="44" y="99">Remote worker</text>
  <rect class="zone" x="290" y="80" width="680" height="116" rx="10"/>
  <text class="ztitle" x="304" y="99">Internet (simulated)</text>
  <rect class="zone" x="990" y="80" width="260" height="340" rx="10"/>
  <text class="ztitle" x="1004" y="99">Branch</text>
  <rect class="zone" x="30" y="270" width="940" height="600" rx="10"/>
  <text class="ztitle" x="44" y="290">HQ</text>
  <rect class="zdmz" x="330" y="300" width="250" height="112" rx="8"/>
  <text class="ztitle2" x="344" y="319">DMZ · 10.19.64.80/29</text>
  <rect class="zsrv" x="40" y="440" width="250" height="262" rx="8"/>
  <text class="ztitle2" x="54" y="459">Server zone · 10.19.64.64/28</text>

  <!-- Public links -->
  <line class="link" x1="490" y1="143" x2="600" y2="143"/>
  <text class="lbl" x="545" y="135" text-anchor="middle">203.0.113.12/30</text>
  <line class="link" x1="780" y1="143" x2="1020" y2="143"/>
  <text class="lbl" x="900" y="135" text-anchor="middle">203.0.113.4/30</text>
  <path class="link" d="M110 178 V222 H640 V178"/>
  <text class="lbl" x="380" y="214" text-anchor="middle">203.0.113.8/30</text>
  <line class="link" x1="720" y1="178" x2="720" y2="310"/>
  <text class="lbl" x="728" y="293">203.0.113.0/30</text>

  <!-- Tunnels -->
  <path class="tun" d="M200 178 V236 H660 V310"/>
  <text class="lblr" x="430" y="256" text-anchor="middle">OpenVPN tunnel · pool 10.19.64.0/27</text>
  <path class="tun" d="M820 345 C900 345 1000 262 1060 178"/>
  <text class="lblr" x="830" y="392">IPsec tunnel (VTI)</text>
  <text class="lblr" x="830" y="408">10.19.64.96/30</text>
  <text class="lblr" x="830" y="424">OPNsense .97</text>
  <text class="lblr" x="830" y="440">br-rtr .98</text>

  <!-- Branch LAN -->
  <line class="link" x1="1120" y1="178" x2="1120" y2="330"/>
  <text class="lbl" x="1128" y="250">branch LAN</text>
  <text class="lbl" x="1128" y="266">10.19.0.0/24</text>

  <!-- HQ links -->
  <line class="link" x1="545" y1="365" x2="620" y2="365"/>
  <line class="link" x1="720" y1="380" x2="720" y2="470"/>
  <text class="lbl" x="712" y="430" text-anchor="end">10.19.64.88/30 · OSPF area 0</text>
  <line class="link" x1="500" y1="505" x2="620" y2="505"/>
  <text class="lbl" x="560" y="497" text-anchor="middle">10.19.64.92/30</text>
  <path class="link" d="M300 505 H270 V645"/>
  <line class="link" x1="245" y1="555" x2="270" y2="555"/>
  <line class="link" x1="245" y1="645" x2="270" y2="645"/>
  <line class="link" x1="680" y1="540" x2="530" y2="640"/>
  <line class="link" x1="760" y1="540" x2="850" y2="640"/>
  <text class="lbl" x="720" y="600" text-anchor="middle">802.1Q trunks</text>
  <line class="stp" x1="600" y1="668" x2="760" y2="668"/>
  <text class="lbl" x="680" y="658" text-anchor="middle">STP blocks one port</text>
  <line class="link" x1="480" y1="696" x2="395" y2="770"/>
  <line class="link" x1="560" y1="696" x2="605" y2="770"/>
  <line class="link" x1="850" y1="696" x2="845" y2="770"/>

  <!-- Nodes: remote, Internet, branch -->
  <rect class="node" x="55" y="108" width="190" height="70" rx="8"/>
  <text class="name" x="150" y="130">remote-pc</text>
  <text class="sub" x="150" y="149">OpenVPN client</text>
  <text class="sub" x="150" y="166">WAN 203.0.113.10</text>

  <rect class="node" x="320" y="108" width="170" height="70" rx="8"/>
  <text class="name" x="405" y="130">ext-host</text>
  <text class="sub" x="405" y="149">outside client</text>
  <text class="sub" x="405" y="166">203.0.113.14</text>

  <rect class="node" x="600" y="108" width="180" height="70" rx="8"/>
  <text class="name" x="690" y="130">isp-rtr</text>
  <text class="sub" x="690" y="149">simulated ISP (FRR)</text>
  <text class="sub" x="690" y="166">.1 · .5 · .9 · .13</text>

  <rect class="node" x="1020" y="108" width="200" height="70" rx="8"/>
  <text class="name" x="1120" y="130">br-rtr</text>
  <text class="sub" x="1120" y="149">IPsec · OSPF · NAT · FW</text>
  <text class="sub" x="1120" y="166">WAN .6 · LAN .1</text>

  <rect class="node" x="1020" y="330" width="200" height="70" rx="8"/>
  <text class="name" x="1120" y="352">br-pc</text>
  <text class="sub" x="1120" y="371">branch user</text>
  <text class="sub" x="1120" y="388">10.19.0.2</text>

  <!-- Nodes: HQ -->
  <rect class="fw" x="620" y="310" width="200" height="70" rx="8"/>
  <text class="name" x="720" y="332">opnsense</text>
  <text class="sub" x="720" y="351">edge firewall · NAT · VPN</text>
  <text class="sub" x="720" y="368">WAN .2 · DMZ .81 · LAN .90</text>

  <rect class="node" x="365" y="330" width="180" height="70" rx="8"/>
  <text class="name" x="455" y="352">dmz-web</text>
  <text class="sub" x="455" y="371">public website</text>
  <text class="sub" x="455" y="388">10.19.64.82</text>

  <rect class="node" x="620" y="470" width="200" height="70" rx="8"/>
  <text class="name" x="720" y="492">core-sw</text>
  <text class="sub" x="720" y="511">L3 core · OSPF (cEOS)</text>
  <text class="sub" x="720" y="528">.89 to OPN · .93 to FGT</text>

  <rect class="fw" x="300" y="470" width="200" height="70" rx="8"/>
  <text class="name" x="400" y="492">fortigate</text>
  <text class="sub" x="400" y="511">internal firewall (ISFW)</text>
  <text class="sub" x="400" y="528">port2 .94 · port3 .65</text>

  <rect class="node" x="55" y="520" width="190" height="70" rx="8"/>
  <text class="name" x="150" y="542">srv-dns</text>
  <text class="sub" x="150" y="561">DHCP + DNS</text>
  <text class="sub" x="150" y="578">10.19.64.66</text>

  <rect class="node" x="55" y="610" width="190" height="70" rx="8"/>
  <text class="name" x="150" y="632">srv-app</text>
  <text class="sub" x="150" y="651">internal app</text>
  <text class="sub" x="150" y="668">10.19.64.67</text>

  <rect class="node" x="420" y="640" width="180" height="56" rx="8"/>
  <text class="name" x="510" y="662">acc-sw1</text>
  <text class="sub" x="510" y="682">access switch (cEOS)</text>

  <rect class="node" x="760" y="640" width="180" height="56" rx="8"/>
  <text class="name" x="850" y="662">acc-sw2</text>
  <text class="sub" x="850" y="682">access switch (cEOS)</text>

  <rect class="node" x="300" y="770" width="190" height="70" rx="8"/>
  <text class="name" x="395" y="792">user-pc1</text>
  <text class="sub" x="395" y="811">USERS · VLAN 100</text>
  <text class="sub" x="395" y="828">DHCP</text>

  <rect class="node" x="510" y="770" width="190" height="70" rx="8"/>
  <text class="name" x="605" y="792">guest-kali</text>
  <text class="sub" x="605" y="811">GUEST · VLAN 10</text>
  <text class="sub" x="605" y="828">DHCP</text>

  <rect class="node" x="750" y="770" width="190" height="70" rx="8"/>
  <text class="name" x="845" y="792">user-pc2</text>
  <text class="sub" x="845" y="811">USERS · VLAN 100</text>
  <text class="sub" x="845" y="828">DHCP</text>

  <!-- VLAN box -->
  <rect class="info" x="40" y="722" width="250" height="128" rx="8"/>
  <text class="ptitle" x="54" y="745">VLANs on core-sw</text>
  <text class="pbold" x="54" y="769">VLAN 100 · USERS</text>
  <text class="ptext" x="54" y="787">10.18.0.0/22 · gw 10.18.0.1</text>
  <text class="pbold" x="54" y="813">VLAN 10 · GUEST</text>
  <text class="ptext" x="54" y="831">10.19.64.32/27 · gw 10.19.64.33</text>

  <!-- Right panel -->
  <rect class="panel" x="990" y="440" width="260" height="430" rx="10"/>
  <text class="ptitle" x="1006" y="466">IP plan v1</text>
  <text class="ptext" x="1006" y="490">Internal summary</text>
  <text class="pval" x="1236" y="490">10.18.0.0/15</text>
  <text class="ptext" x="1006" y="510">Public links</text>
  <text class="pval" x="1236" y="510">203.0.113.0/28</text>
  <text class="ptext" x="1006" y="530">VPN pool</text>
  <text class="pval" x="1236" y="530">10.19.64.0/27</text>

  <text class="ptitle" x="1006" y="566">Legend</text>
  <line class="link" x1="1006" y1="586" x2="1046" y2="586"/>
  <text class="ptext" x="1056" y="590">Link</text>
  <line class="tun" x1="1006" y1="608" x2="1046" y2="608"/>
  <text class="ptext" x="1056" y="612">Tunnel (IPsec, OpenVPN)</text>
  <line class="stp" x1="1006" y1="630" x2="1046" y2="630"/>
  <text class="ptext" x="1056" y="634">Trunk blocked by STP</text>
  <rect class="fw" x="1006" y="646" width="40" height="16" rx="3"/>
  <text class="ptext" x="1056" y="658">Firewall</text>

  <text class="ptitle" x="1006" y="694">Management (not drawn)</text>
  <text class="ptext" x="1006" y="716">Out-of-band only.</text>
  <text class="ptext" x="1006" y="736">Switches: Ma0 ports on</text>
  <text class="ptext" x="1006" y="754">172.20.20.0/24</text>
  <text class="ptext" x="1006" y="774">Firewalls: virbr0 on</text>
  <text class="ptext" x="1006" y="792">192.168.122.0/24</text>
  <text class="ptext" x="1006" y="812">FortiGate port1 → virbr0 →</text>
  <text class="ptext" x="1006" y="830">real Internet (license check)</text>
  <text class="ptext" x="1006" y="854">Gateways: first usable address</text>
</svg>
